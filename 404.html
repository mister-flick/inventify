<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4ee">
    <title>Page not found — Inventify</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: #f3f4ee; color: #172724; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 510px); padding: 44px; border: 1px solid #d9ded5; background: #fbfcf8; }
      .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 11px; background: #183a32; color: #d7ec91; font: 26px Georgia, serif; }
      p { margin: 35px 0 10px; color: #718076; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0 0 14px; font: 500 42px/1.05 Georgia, serif; letter-spacing: -.04em; }
      main > span { color: #758078; font-size: 14px; line-height: 1.7; }
      a { display: inline-flex; margin-top: 28px; padding: 13px 16px; border-radius: 3px; background: #183a32; color: #fff; font-size: 13px; font-weight: 650; text-decoration: none; }
      a:focus-visible { outline: 3px solid #557f46; outline-offset: 4px; }
      @media (max-width: 480px) { main { padding: 30px 25px; } h1 { font-size: 36px; } }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">i</span>
      <p>Inventify · macOS</p>
      <h1>This page isn’t in the inventory.</h1>
      <span>The address may have changed, or the page may not exist yet.</span>
      <a href="/inventify/">Return to Inventify</a>
    </main>
  </body>
</html>
